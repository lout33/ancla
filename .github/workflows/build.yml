name: build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        run: ./build.sh
      - name: Rule checks
        run: ./test.sh
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Ancla.app
          path: build/Ancla.app
